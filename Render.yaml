services:
  - type: web
    name: mauriguide-ai
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: DJANGO_URL
        value: "http://127.0.0.1:8000"
      - key: PYTHON_VERSION
        value: "3.11.0"