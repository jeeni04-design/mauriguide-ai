<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourist Registration — MauriGuide</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;overflow:hidden;background:#000;position:relative}
.slide{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease-in-out;z-index:0}
.slide.active{opacity:1;animation:kb 14s ease-in-out forwards}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.08) translateX(-1%) translateY(-1%)}}
@keyframes kb2{0%{transform:scale(1.06) translateX(-1%)}100%{transform:scale(1) translateX(1%) translateY(1%)}}
@keyframes kb3{0%{transform:scale(1) translateX(1%)}100%{transform:scale(1.1) translateX(-1%) translateY(-1%)}}
.overlay{position:fixed;inset:0;z-index:1;background:linear-gradient(135deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.35) 50%,rgba(0,0,0,.55) 100%)}
.ui{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}

/* Back link */
.back{position:fixed;top:22px;left:28px;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.7);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s;z-index:10}
.back:hover{color:white}
.back svg{flex-shrink:0}

/* Card */
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;width:100%;max-width:480px;padding:36px 40px;box-shadow:0 24px 60px rgba(0,0,0,.4)}

/* Header */
.card-hdr{text-align:center;margin-bottom:28px}
.card-icon{width:52px;height:52px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.card-title{font-size:1.4rem;font-weight:800;color:white;margin-bottom:5px;letter-spacing:-.3px}
.card-sub{font-size:13px;color:rgba(255,255,255,.55)}

/* Form */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.6);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.fg input,.fg select{width:100%;padding:10px 13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:13px;color:white;font-family:inherit;outline:none;transition:border .15s}
.fg input:focus,.fg select:focus{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.12)}
.fg input::placeholder{color:rgba(255,255,255,.3)}
.fg select option{background:#1e293b;color:white}

/* Checkboxes */
.checks{margin:4px 0 18px}
.chk{display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;cursor:pointer}
.chk input{width:15px;height:15px;margin-top:1px;accent-color:#7c6dfa;flex-shrink:0;cursor:pointer}
.chk span{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5}
.chk span b{color:rgba(255,255,255,.85);font-weight:500}

/* Divider */
.divider{height:1px;background:rgba(255,255,255,.1);margin:16px 0}

/* Submit */
.submit-btn{width:100%;padding:13px;background:white;color:#0f172a;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.submit-btn:hover{background:rgba(255,255,255,.92);transform:translateY(-1px)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Alert */
.alert{padding:10px 13px;border-radius:9px;margin-bottom:16px;font-size:12px;font-weight:500}
.alert-error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.alert-success{background:rgba(16,216,122,.12);border:1px solid rgba(16,216,122,.25);color:#6ee7b7}

/* Login link */
.login-row{text-align:center;margin-top:18px;font-size:12px;color:rgba(255,255,255,.45)}
.login-row a{color:rgba(255,255,255,.75);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
.login-row a:hover{color:white;border-color:rgba(255,255,255,.6)}

@media(max-width:520px){
  .card{padding:26px 22px}
  .frow{grid-template-columns:1fr}
  .back{top:14px;left:14px}
}
</style>
</head>
<body data-bg="{% static 'frontend/images/home3.jpg' %}">

<div class="slide active" id="s0"></div>
<div class="overlay"></div>

<a href="/" class="back">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 12L6 8l4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Back
</a>

<div class="ui">
  <div class="card">
    <div class="card-hdr">
      <div class="card-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <circle cx="13" cy="13" r="11" stroke="white" stroke-width="1.4" fill="none" opacity="0.5"/>
          <path d="M6 15l3-1.2 1.8 2.8 3.5-7 3.2 1.8 3.5-6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="5" r="2" fill="white" opacity="0.8"/>
        </svg>
      </div>
      <div class="card-title">Tourist Registration</div>
      <div class="card-sub">Create your MauriGuide account</div>
    </div>

    <div id="alert"></div>

    <form id="regForm" onsubmit="handleSubmit(event)">
      <div class="frow">
        <div class="fg"><label>Username *</label><input type="text" id="username" placeholder="yourname" required></div>
        <div class="fg"><label>Email *</label><input type="email" id="email" placeholder="you@email.com" required></div>
      </div>
      <div class="fg">
        <label>Country *</label>
        <select id="country" required>
          <option value="">Select your country</option>
          <option value="MU">Mauritius</option>
          <option value="FR">France</option>
          <option value="GB">United Kingdom</option>
          <option value="DE">Germany</option>
          <option value="US">United States</option>
          <option value="IN">India</option>
          <option value="CN">China</option>
          <option value="JP">Japan</option>
          <option value="AU">Australia</option>
          <option value="CA">Canada</option>
          <option value="ZA">South Africa</option>
          <option value="IT">Italy</option>
          <option value="ES">Spain</option>
          <option value="BR">Brazil</option>
          <option value="MX">Mexico</option>
          <option value="RE">Réunion</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div class="frow">
        <div class="fg"><label>Password *</label><input type="password" id="password" placeholder="min 8 characters" minlength="8" required></div>
        <div class="fg"><label>Confirm Password *</label><input type="password" id="password2" placeholder="repeat password" minlength="8" required></div>
      </div>

      <div class="divider"></div>

      <div class="checks">
        <label class="chk"><input type="checkbox" id="consent" required><span><b>I consent to data collection</b> as per DPA 2017 *</span></label>
        <label class="chk"><input type="checkbox" id="cookies"><span>Accept cookies for a better experience</span></label>
        <label class="chk"><input type="checkbox" id="marketing"><span>Send me travel tips and updates from MauriGuide</span></label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M9 4l5 4-5 4" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Create Account
      </button>
    </form>

    <p class="login-row">Already have an account? <a href="/login/">Sign in here</a></p>
  </div>
</div>

<script>
// Single background from data attribute
document.getElementById('s0').style.backgroundImage="url('"+document.body.getAttribute('data-bg')+"')";

async function handleSubmit(e){
  e.preventDefault();
  var btn=document.getElementById('submitBtn');
  var alertBox=document.getElementById('alert');
  btn.disabled=true;
  btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="20" stroke-dashoffset="0"><animateTransform attributeName="transform" type="rotate" from="0 8 8" to="360 8 8" dur="0.8s" repeatCount="indefinite"/></circle></svg> Creating account...';
  alertBox.innerHTML='';
  var data={
    username:document.getElementById('username').value,
    email:document.getElementById('email').value,
    country:document.getElementById('country').value,
    password:document.getElementById('password').value,
    password_confirm:document.getElementById('password2').value,
    user_type:'tourist',
    data_consent:document.getElementById('consent').checked,
    cookie_consent:document.getElementById('cookies').checked,
    marketing_consent:document.getElementById('marketing').checked
  };
  try{
    var res=await fetch('/api/accounts/register/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    var result=await res.json();
    if(res.ok){
      alertBox.innerHTML="<div class='alert alert-success'>✓ Account created! Taking you to your dashboard...</div>";
      localStorage.setItem('access_token',result.tokens.access);
      localStorage.setItem('refresh_token',result.tokens.refresh);
      localStorage.setItem('user',JSON.stringify(result.user));
      setTimeout(function(){window.location.href='/dashboard/';},1500);
    } else {
      var msg="<div class='alert alert-error'><strong>Registration failed:</strong><br>";
      for(var k in result){msg+=k+': '+result[k]+'<br>';}
      msg+="</div>";
      alertBox.innerHTML=msg;
      btn.disabled=false;
      btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M9 4l5 4-5 4" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Create Account';
    }
  }catch(err){
    alertBox.innerHTML="<div class='alert alert-error'>Network error. Please try again.</div>";
    btn.disabled=false;
    btn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h12M9 4l5 4-5 4" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Create Account';
  }
}
</script>
</body>
</html>
